name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            separator: ";"
            bundle-mode: --onefile
          - os: macos-latest
            platform: macOS
            separator: ":"
            bundle-mode: --onedir
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build desktop application
        shell: bash
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          ${{ matrix.bundle-mode }}
          --windowed
          --name diemRenLuyen
          --add-data "templates${{ matrix.separator }}templates"
          --add-data "static${{ matrix.separator }}static"
          desktop_launcher.py
      - name: Package Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/diemRenLuyen-Windows | Out-Null
          Copy-Item dist/diemRenLuyen.exe, README.md, LICENSE release/diemRenLuyen-Windows/
          Compress-Archive -Path release/diemRenLuyen-Windows -DestinationPath release/diemRenLuyen-Windows.zip
      - name: Package macOS download
        if: runner.os == 'macOS'
        run: |
          mkdir -p release/diemRenLuyen-macOS
          cp -R dist/diemRenLuyen.app release/diemRenLuyen-macOS/
          cp README.md LICENSE release/diemRenLuyen-macOS/
          ditto -c -k --sequesterRsrc --keepParent release/diemRenLuyen-macOS release/diemRenLuyen-macOS.zip
      - uses: actions/upload-artifact@v6
        with:
          name: diemRenLuyen-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes --title "diemRenLuyen ${GITHUB_REF_NAME}"
