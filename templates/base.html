<!doctype html>
<html lang="{{ current_language() }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}diemRenLuyen{% endblock %}</title>
    <meta name="description" content="{{ t('Send new Facebook Page posts to Telegram.') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  </head>
  <body data-show="{{ t('Show') }}" data-hide="{{ t('Hide') }}" data-working="{{ t('Working…') }}">
    {% block body %}{% endblock %}
  </body>
</html>
